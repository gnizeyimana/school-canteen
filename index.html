
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Canteen Ordering</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>My School Canteen</h2>
        <button id="logoutBtn" onclick="logout()" hidden>
            Logout
        </button>
    </header>

    <!-- LOGIN -->
    <section id="loginPage" class="login-container">
        <h1>Welcome</h1>
        <p>Login using your email address</p>

        <input type="email" id="email"
               placeholder="Enter your email" required>

        <button onclick="login()">Login</button>
        <p id="loginMessage"></p>
    </section>

    <!-- ADMIN DASHBOARD -->
    <main id="adminPage" hidden>

        <h1>Administrator Dashboard</h1>
        <p>Manage canteen products and student orders.</p>

        <section class="panel">
            <h2>Add New Product</h2>

            <input id="productName"
                   placeholder="Product name">

            <input id="productPrice" type="number"
                   placeholder="Price in RWF">

            <input id="productImage"
                   placeholder="Image URL (optional)">

            <input id="productPlace"
                   placeholder="Serving location">

            <button onclick="addProduct()">
                Add Product
            </button>
        </section>

        <section class="panel">
            <h2>Available Products</h2>
            <div id="adminProducts" class="products"></div>
        </section>

        <section class="panel">
            <h2>Student Orders</h2>
            <div id="allOrders"></div>
        </section>

    </main>

    <!-- STUDENT PAGE -->
    <main id="studentPage" hidden>

        <h1>Student Dashboard</h1>
        <p id="studentEmail"></p>

        <section class="panel">
            <h2>Available Canteen Products</h2>
            <div id="studentProducts" class="products"></div>
        </section>

        <section class="panel">
            <h2>My Orders</h2>
            <div id="myOrders"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
